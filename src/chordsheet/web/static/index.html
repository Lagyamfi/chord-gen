<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChordSheet</title>
<style>
  :root {
    --bg: #faf8f5; --panel: #ffffff; --ink: #1d1b19; --muted: #77716a; --line: #e6e1da;
    --accent: #c2410c; --accent-soft: #fde7d9; --now: #1d1b19; --outkey: #7c3aed; --wave: #d6cfc6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312; --panel: #1d1c1a; --ink: #f2efea; --muted: #8f887f; --line: #2e2c29;
      --accent: #fb923c; --accent-soft: #3a2416; --now: #f2efea; --outkey: #a78bfa; --wave: #3b3834;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .02em; }
  select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 8px; max-width: 100%; }
  .meta { color: var(--muted); font-size: 13px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }

  .now { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end;
         background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .now .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .now .chord { font-size: clamp(56px, 14vw, 104px); font-weight: 700; line-height: 1; color: var(--now); }
  .now .chord.pending { opacity: .3; }
  .now .roman { font-size: 22px; color: var(--accent); font-weight: 600; margin-top: 4px; min-height: 1.2em; }
  .next { text-align: right; min-width: 110px; }
  .next .chord { font-size: clamp(28px, 7vw, 44px); color: var(--muted); }
  .countdown { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .countdown div { height: 100%; width: 0; background: var(--accent); }

  .transport { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; }
  button.play { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent);
                color: #fff; font-size: 18px; cursor: pointer; flex: none; }
  button.play:disabled { opacity: .4; cursor: default; }
  #wave { flex: 1; min-width: 0; }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; flex: none; }

  .chart { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
  @media (max-width: 600px) { .chart { grid-template-columns: repeat(2, 1fr); } }
  .bar { display: flex; min-height: 58px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 8px; overflow: hidden; cursor: pointer; scroll-margin: 140px; }
  .bar.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .seg { padding: 6px 8px; border-left: 1px dashed var(--line); min-width: 0; }
  .seg:first-child { border-left: none; }
  .seg .c { font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg .r { color: var(--muted); font-size: 12px; }
  .seg.out .c, .seg.out .r { color: var(--outkey); }
  .seg.nc .c { color: var(--muted); font-weight: 400; }
  .seg.current { background: var(--accent-soft); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .now { grid-template-columns: 1fr auto auto; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; min-height: 1.2em; }
  .diagram { width: 104px; height: 124px; align-self: center; }
  .diagram svg { width: 100%; height: 100%; display: block; }
  .diagram .str, .diagram .fret { stroke: var(--muted); stroke-width: 1; }
  .diagram .nut { stroke: var(--ink); stroke-width: 4; }
  .diagram .dot, .diagram .barre { fill: var(--ink); }
  .diagram text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .diagram .mark { fill: none; stroke: var(--muted); stroke-width: 1.4; }
  .diagram .warn { fill: var(--outkey); }
  button.mode { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.mode[hidden] { display: none; }
  .bar.dense .seg { padding: 6px 4px; }
  .bar.dense .seg .c { font-size: 14px; }
  @media (max-width: 600px) {
    .now { grid-template-columns: 1fr auto; }
    .diagram { grid-column: 2; grid-row: 1; width: 84px; height: 100px; }
    .next { grid-column: 1 / -1; text-align: left; }
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
</style>
</head>
<body>
<header>
  <h1>ChordSheet</h1>
  <select id="song" aria-label="Song"></select>
  <select id="system" aria-label="Transcriber"></select>
  <button class="mode" id="mode" hidden></button>
  <span class="meta" id="meta"></span>
</header>
<main>
  <section class="now" aria-live="polite">
    <div>
      <div class="label">Now</div>
      <div class="chord" id="nowChord">–</div>
      <div class="roman" id="nowRoman"></div>
      <div class="sub" id="nowSub"></div>
    </div>
    <div class="diagram" id="diagram" aria-label="Chord shape"></div>
    <div class="next">
      <div class="label">Next</div>
      <div class="chord" id="nextChord">–</div>
      <div class="countdown"><div id="countdown"></div></div>
    </div>
  </section>

  <div class="transport">
    <button class="play" id="play" disabled aria-label="Play">▶</button>
    <div id="wave"></div>
    <span class="time" id="time">0:00</span>
  </div>

  <div class="chart" id="chart"></div>
  <p class="hint">Space: play/pause · ← →: previous/next bar · click a bar to jump.
    <span style="color:var(--outkey)">Purple</span> chords are outside the key: the ones worth learning.
    With a capo, the big chord is the shape to play; "sounds" is the chord you hear.</p>
</main>

<script type="module">
import WaveSurfer from "https://unpkg.com/wavesurfer.js@7.8.6/dist/wavesurfer.esm.js";

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

let ws = null, bars = [], segs = [], lastSeg = -1;
let sheet = null, showShapes = true;  // with a capo: show what to fret (true) or what sounds (false)
const capoFret = () => sheet?.capo?.fret ?? 0;
const label = (seg) => (seg ? (showShapes && capoFret() ? seg.shape : seg.chord) : "");

// bars of beats -> bars of chord segments (consecutive beats with the same chord)
function buildSegments() {
  bars = []; segs = [];
  sheet.bars.forEach((beats, b) => {
    const bar = { start: beats[0].start, end: beats.at(-1).end, segs: [] };
    for (const beat of beats) {
      // group by chord, not by bass: a walking bass would otherwise split C into C, C/E, C...
      const last = bar.segs.at(-1);
      if (last && last.id === beat.mir_eval) {
        last.end = beat.end; last.beats++; last.names.push(beat.chord); last.shapes.push(beat.shape ?? beat.chord);
        continue;
      }
      const seg = { id: beat.mir_eval, names: [beat.chord], shapes: [beat.shape ?? beat.chord],
                    roman: beat.roman, inKey: beat.in_key,
                    start: beat.start, end: beat.end, beats: 1, bar: b };
      bar.segs.push(seg);
      segs.push(seg);
    }
    bars.push(bar);
  });
  // show a slash bass only when it is the most common bass over the chord; ties go to the plain name
  for (const seg of segs) {
    const counts = {};
    for (const n of seg.names) counts[n] = (counts[n] || 0) + 1;
    const plain = seg.names.find((n) => !n.includes("/")) ?? seg.names[0].split("/")[0];
    seg.chord = Object.entries(counts).reduce(
      (best, [n, c]) => (c > (counts[best] || 0) ? n : best), plain);
    const k = seg.names.indexOf(seg.chord);
    seg.shape = k >= 0 ? seg.shapes[k] : seg.shapes[0].split("/")[0];
  }
}

function renderChart() {
  const chart = $("chart");
  chart.innerHTML = "";
  bars.forEach((bar, b) => {
    const el = document.createElement("div");
    el.className = "bar" + (bar.segs.length > 2 ? " dense" : ""); el.dataset.bar = b;
    el.onclick = () => seek(bar.start);
    for (const s of bar.segs) {
      const seg = document.createElement("div");
      seg.className = "seg" + (s.chord === "N.C." ? " nc" : s.inKey ? "" : " out");
      seg.style.flex = s.beats;
      seg.innerHTML = `<div class="c"></div><div class="r"></div>`;
      seg.querySelector(".c").textContent = label(s);
      seg.title = capoFret() ? `play ${s.shape} · sounds ${s.chord}` : s.chord;
      seg.querySelector(".r").textContent = s.roman === "-" ? "" : s.roman;
      s.el = seg;
      el.appendChild(seg);
    }
    bar.el = el;
    chart.appendChild(el);
  });
}

function segAt(t) {
  let lo = 0, hi = segs.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (segs[mid].start <= t) { found = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return found;
}

function update(t) {
  $("time").textContent = fmt(t);
  const i = segAt(t);
  const cur = segs[i];
  // next segment with a different chord
  let j = i + 1;
  while (j < segs.length && segs[j].id === cur?.id) j++;
  const next = segs[j];
  // before the first chord, show it muted so the box is never blank
  const shown = cur ?? segs[0];
  $("nowChord").textContent = label(shown);
  $("nowSub").textContent = shown && capoFret() && shown.chord !== "N.C."
    ? (showShapes ? `sounds ${shown.chord}` : `play ${shown.shape} · capo ${capoFret()}`) : "";
  $("nowChord").classList.toggle("pending", !cur);
  $("nowRoman").textContent = cur && cur.roman !== "-" ? cur.roman : "";
  $("nextChord").textContent = next ? label(next) : "–";
  if (cur && next) {
    const span = next.start - cur.start;
    $("countdown").style.width = `${Math.min(100, ((t - cur.start) / span) * 100)}%`;
  } else $("countdown").style.width = "0";

  if (i !== lastSeg) {
    $("diagram").innerHTML = diagram(sheet?.voicings?.[shown?.shape]);
    segs[lastSeg]?.el.classList.remove("current");
    if (segs[lastSeg]) bars[segs[lastSeg].bar].el.classList.remove("current");
    if (cur) {
      cur.el.classList.add("current");
      const barEl = bars[cur.bar].el;
      barEl.classList.add("current");
      if (ws?.isPlaying()) barEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    lastSeg = i;
  }
}

// SVG chord box: 6 strings, 4 frets shown, dots, open/muted markers, barre, position
function diagram(v) {
  if (!v) return "";
  const fretted = v.frets.filter((f) => f !== null && f > 0);
  const top = fretted.length ? Math.max(...fretted) : 0;
  const base = top > 4 ? Math.min(...fretted) : 1;
  const X = (s) => 16 + s * 15, Y = (f) => 28 + (f - base) * 22;
  let out = `<svg viewBox="0 0 104 124" role="img"><title>${v.name}: ${v.frets.map((f) => f ?? "x").join(" ")}</title>`;
  for (let s = 0; s < 6; s++) out += `<line class="str" x1="${X(s)}" y1="28" x2="${X(s)}" y2="116"/>`;
  for (let f = 0; f <= 4; f++) out += `<line class="${f === 0 && base === 1 ? "nut" : "fret"}" x1="${X(0)}" y1="${28 + f * 22}" x2="${X(5)}" y2="${28 + f * 22}"/>`;
  if (base > 1) out += `<text x="${X(5) + 6}" y="${Y(base) + 15}">${base}fr</text>`;
  if (v.barre && fretted.length) {
    const low = Math.min(...fretted);
    const strs = v.frets.map((f, s) => (f === low ? s : -1)).filter((s) => s >= 0);
    if (strs.length > 1) out += `<rect class="barre" x="${X(strs[0]) - 5}" y="${Y(low) + 6}" width="${X(strs.at(-1)) - X(strs[0]) + 10}" height="10" rx="5"/>`;
  }
  v.frets.forEach((f, s) => {
    if (f === null) out += `<text x="${X(s) - 3.5}" y="20">×</text>`;
    else if (f === 0) out += `<circle class="mark" cx="${X(s)}" cy="16" r="4"/>`;
    else out += `<circle class="dot" cx="${X(s)}" cy="${Y(f) + 11}" r="5.5"/>`;
  });
  if (v.generated) out += `<circle class="warn" cx="98" cy="6" r="3"><title>generated barre shape</title></circle>`;
  return out + "</svg>";
}

function setMode() {
  const c = capoFret();
  $("mode").hidden = !c;
  $("mode").textContent = showShapes ? `Showing shapes · capo ${c}` : "Showing sounding chords";
  renderChart(); lastSeg = -1; update(ws?.getCurrentTime() ?? 0);
}

function seek(t) { ws?.setTime(t); update(t); }

async function loadSong(id, system) {
  const q = system ? `?system=${encodeURIComponent(system)}` : "";
  sheet = await (await fetch(`/api/songs/${id}/sheet${q}`)).json();
  const c = capoFret();
  $("meta").textContent = `${sheet.key} · ${Math.round(sheet.tempo)} BPM` + (c ? ` · capo ${c}` : "");
  buildSegments(); setMode();

  const keep = ws && ws.__song === id ? ws.getCurrentTime() : 0;
  if (!ws || ws.__song !== id) {
    ws?.destroy();
    $("play").disabled = true;
    ws = WaveSurfer.create({
      container: "#wave", url: `/api/songs/${id}/audio`, height: 48,
      waveColor: css("--wave"), progressColor: css("--accent"), cursorColor: css("--ink"),
      barWidth: 2, barGap: 1, barRadius: 1,
    });
    ws.__song = id;
    ws.on("ready", () => { $("play").disabled = false; update(0); });
    ws.on("timeupdate", update);
    ws.on("play", () => { $("play").textContent = "❚❚"; $("play").ariaLabel = "Pause"; });
    ws.on("pause", () => { $("play").textContent = "▶"; $("play").ariaLabel = "Play"; });
  }
  update(keep);
}

async function init() {
  const songs = await (await fetch("/api/songs")).json();
  if (!songs.length) {
    document.querySelector("main").innerHTML =
      `<p class="empty">No analysed songs yet. Run <code>chordsheet analyse &lt;file or URL&gt;</code> first.</p>`;
    return;
  }
  const songSel = $("song"), sysSel = $("system");
  for (const s of songs) songSel.add(new Option(s.artist ? `${s.title} — ${s.artist}` : s.title, s.id));
  const fillSystems = () => {
    const s = songs.find((x) => x.id === songSel.value);
    sysSel.innerHTML = "";
    for (const name of s.systems) sysSel.add(new Option(name, name));
  };
  const saved = (() => { try { return localStorage.getItem("chordsheet.song"); } catch { return null; } })();
  if (saved && songs.some((s) => s.id === saved)) songSel.value = saved;
  fillSystems();
  songSel.onchange = () => {
    try { localStorage.setItem("chordsheet.song", songSel.value); } catch {}
    fillSystems(); loadSong(songSel.value, sysSel.value);
  };
  sysSel.onchange = () => loadSong(songSel.value, sysSel.value);
  $("play").onclick = () => ws?.playPause();
  try { showShapes = localStorage.getItem("chordsheet.shapes") !== "0"; } catch {}
  $("mode").onclick = () => {
    showShapes = !showShapes;
    try { localStorage.setItem("chordsheet.shapes", showShapes ? "1" : "0"); } catch {}
    setMode();
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); ws?.playPause(); }
    if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
      const cur = segs[segAt(ws?.getCurrentTime() ?? 0)];
      const b = Math.max(0, Math.min(bars.length - 1, (cur?.bar ?? 0) + (e.code === "ArrowRight" ? 1 : -1)));
      seek(bars[b].start);
    }
  });
  loadSong(songSel.value, sysSel.value);
}
init();
</script>
</body>
</html>
